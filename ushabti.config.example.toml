[github]
# Use `ushabti secrets set github` for setting your GitHub token.

# Shared Atlassian Cloud credentials, used by both jira and confluence commands.
[atlassian]
baseUrl = ""
email = ""
# Use `ushabti secrets set atlassian` for setting your Atlassian token.

[jira]
# Custom field id for story points, e.g. "customfield_10026". Optional.
storyPointsField = ""
# Custom field id for sprint, e.g. "customfield_10020". Optional.
sprintField = ""

[confluence.plugins]
# Default producer for mermaid diagrams, keyed by fence language. Only needed
# when a fresh (hand-authored) fence has no plugin details comment yet.
# mermaid = "mermaid"  # Mermaid Integration for Confluence
# mermaid = "uml"      # Mermaid UML Diagram

[ui]
# Automatically open the local browser UI when running a `ui` command (e.g.
# `ui estimate`). Overridden by --browser / --no-browser on the command.
# Optional, default: false.
# openBrowser = false
