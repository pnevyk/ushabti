<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Points</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #181818;
      --border: #666;
      --muted: #888;
      --accent: #5a9aee;
      --accent-bg: #162a45;
      --accent-border: #1e4a82;
      --btn-w: 5.5rem;
      --btn-h: 4rem;
    }

    body {
      background: var(--bg);
      color: #ccc;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 2rem;
    }

    .title {
      text-align: center;
    }

    .title h1 {
      font-size: 1.375rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #999;
    }

    .title p {
      font-size: 0.875rem;
      color: #888;
      margin-top: 0.4rem;
      letter-spacing: 0.05em;
    }

    .calc {
      display: grid;
      grid-template-columns: var(--btn-w) 5rem var(--btn-w) 5rem var(--btn-w) 5rem 7rem 2rem 8rem;
      grid-template-rows: auto auto;
      row-gap: 0.875rem;
      align-items: center;
    }

    .col-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      text-align: center;
    }

    .op {
      font-size: 1.625rem;
      color: #888;
      text-align: center;
      user-select: none;
      font-weight: 300;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .btn {
      width: var(--btn-w);
      height: var(--btn-h);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--muted);
      font-size: 1.375rem;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    .btn:hover {
      background: #222;
      border-color: #555;
      color: #bbb;
    }

    .btn.selected {
      background: var(--accent-bg);
      border-color: var(--accent-border);
      color: var(--accent);
    }

    .ep-value {
      position: relative;
      font-size: 4.5rem;
      font-weight: 200;
      color: var(--accent);
      text-align: center;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .ep-value.empty { color: #666; cursor: default; }

    .summary-value {
      position: relative;
      font-size: 1.5rem;
      font-weight: 400;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      color: var(--accent);
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .summary-value.empty { color: #666; cursor: default; }

    @keyframes copied-fade {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
      80%  { opacity: 1; transform: translateX(-50%) translateY(-4px); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
    }

    .copied-banner {
      position: absolute;
      bottom: calc(100% + 0.25rem);
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .copied-banner.visible {
      animation: copied-fade 1s ease-out forwards;
    }

    .hint-area {
      font-size: 0.9375rem;
      color: #888;
      min-height: 1.375rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="title">
    <h1>Energy Points</h1>
    <p>(distance + friction) &times; relativity</p>
  </div>

  <div class="calc" id="calc">
    <div class="col-label" style="grid-column:1;grid-row:1">Distance</div>
    <div style="grid-column:2;grid-row:1"></div>
    <div class="col-label" style="grid-column:3;grid-row:1">Friction</div>
    <div style="grid-column:4;grid-row:1"></div>
    <div class="col-label" style="grid-column:5;grid-row:1">Relativity</div>
    <div style="grid-column:6;grid-row:1"></div>
    <div class="col-label" style="grid-column:7;grid-row:1">EP</div>
    <div style="grid-column:8;grid-row:1"></div>
    <div class="col-label" style="grid-column:9;grid-row:1">Summary</div>
  </div>

  <div class="hint-area" id="hint"></div>

  <script>
    const data = [
      {
        id: 'distance', col: 1,
        levels: [
          { v: 5, tip: 'd5 – Exceeds sprint; split into subtasks before starting' },
          { v: 4, tip: 'd4 – Within full sprint (6–10 days)' },
          { v: 3, tip: 'd3 – Within half sprint (3–5 days)' },
          { v: 2, tip: 'd2 – Within quarter sprint (1–2.5 days)' },
          { v: 1, tip: 'd1 – Within one day, assuming total proficiency' },
        ]
      },
      {
        id: 'friction', col: 3,
        levels: [
          { v: 5, tip: 'f5 – Jungle: uncharted territory, no established path' },
          { v: 4, tip: 'f4 – Trail: minimal precedent, mostly innovation required' },
          { v: 3, tip: 'f3 – Off-Road: sparse materials, significant innovation needed' },
          { v: 2, tip: 'f2 – Street: good references, healthy code base' },
          { v: 1, tip: 'f1 – Highway: tutorial-guided, low-hanging work' },
        ]
      },
      {
        id: 'relativity', col: 5,
        levels: [
          { v: 5, tip: 'r5 – Total: completion believed to be impossible' },
          { v: 4, tip: 'r4 – Significant: extensive unknowns along the path' },
          { v: 3, tip: 'r3 – Moderate: several unknowns, but feasible' },
          { v: 2, tip: 'r2 – Low: few identifiable unknowns' },
          { v: 1, tip: 'r1 – Trivial: virtually no unknowns' },
        ]
      }
    ];

    const ops = [
      { sym: '+', col: 2 },
      { sym: '×', col: 4 },
      { sym: '=', col: 6 },
    ];

    const selected = {};
    const calc = document.getElementById('calc');
    const hint = document.getElementById('hint');

    ops.forEach(({ sym, col }) => {
      const el = document.createElement('div');
      el.className = 'op';
      el.style.cssText = `grid-column:${col};grid-row:2`;
      el.textContent = sym;
      calc.appendChild(el);
    });

    const epEl = document.createElement('div');
    epEl.className = 'ep-value empty';
    epEl.id = 'ep';
    epEl.style.cssText = 'grid-column:7;grid-row:2';
    const epNum = document.createElement('span');
    epNum.id = 'ep-num';
    epNum.textContent = '–';
    epEl.appendChild(epNum);
    const copiedBanner = document.createElement('span');
    copiedBanner.className = 'copied-banner';
    copiedBanner.textContent = 'copied';
    epEl.appendChild(copiedBanner);
    epEl.addEventListener('click', () => {
      if (!epEl.classList.contains('empty')) {
        navigator.clipboard.writeText(epNum.textContent);
        copiedBanner.classList.remove('visible');
        void copiedBanner.offsetWidth;
        copiedBanner.classList.add('visible');
      }
    });
    calc.appendChild(epEl);

    const summaryEl = document.createElement('div');
    summaryEl.className = 'summary-value empty';
    summaryEl.id = 'summary';
    summaryEl.style.cssText = 'grid-column:9;grid-row:2';
    const summaryText = document.createElement('span');
    summaryText.id = 'summary-text';
    summaryText.textContent = '–';
    summaryEl.appendChild(summaryText);
    const summaryCopiedBanner = document.createElement('span');
    summaryCopiedBanner.className = 'copied-banner';
    summaryCopiedBanner.textContent = 'copied';
    summaryEl.appendChild(summaryCopiedBanner);
    summaryEl.addEventListener('click', () => {
      if (!summaryEl.classList.contains('empty')) {
        navigator.clipboard.writeText(summaryText.textContent);
        summaryCopiedBanner.classList.remove('visible');
        void summaryCopiedBanner.offsetWidth;
        summaryCopiedBanner.classList.add('visible');
      }
    });
    calc.appendChild(summaryEl);

    data.forEach(m => {
      const col = document.createElement('div');
      col.className = 'buttons';
      col.style.cssText = `grid-column:${m.col};grid-row:2`;

      m.levels.forEach(lvl => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = m.id[0] + lvl.v;

        btn.addEventListener('click', () => {
          selected[m.id] = lvl.v;
          col.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          update();
        });

        btn.addEventListener('mouseenter', () => { hint.textContent = lvl.tip; });
        btn.addEventListener('mouseleave', () => { hint.textContent = ''; });

        col.appendChild(btn);
      });

      calc.appendChild(col);
    });

    function update() {
      const { distance, friction, relativity } = selected;
      const el = document.getElementById('ep');
      const num = document.getElementById('ep-num');
      const summaryEl = document.getElementById('summary');
      const summaryText = document.getElementById('summary-text');
      if (distance != null && friction != null && relativity != null) {
        num.textContent = (distance + friction) * relativity;
        el.classList.remove('empty');
        summaryText.textContent = `d${distance} f${friction} r${relativity}`;
        summaryEl.classList.remove('empty');
      } else {
        num.textContent = '–';
        el.classList.add('empty');
        summaryText.textContent = '–';
        summaryEl.classList.add('empty');
      }
    }
  </script>
</body>
</html>
